name: Build and Test Junction

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get kernel version
        id: kernel-version
        run: echo "KERNEL_VERSION=$(uname -r)" >> $GITHUB_ENV

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: linux-headers-${{ env.KERNEL_VERSION }} build-essential flex bison libelf-dev libssl-dev libboost-dev libboost-program-options-dev libfmt-dev libcap-dev
          version: 1.0

      - name: Cache CMake builds
        uses: actions/cache@v4
        with:
          path: |
            build/
            lib/caladan/build/
            lib/cereal/build/
            lib/flatbuffers/build/
          key: ${{ runner.os }}-cmake-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cmake-

      - name: Setup kernel module build environment
        run: |
          # Create symlink to ensure kernel build can find the source
          sudo ln -sf /usr/src/linux-headers-$(uname -r) /lib/modules/$(uname -r)/build
          # Set up ksched build directory and copy source files
          mkdir -p lib/caladan/ksched/build
          cp lib/caladan/ksched/*.c lib/caladan/ksched/*.h lib/caladan/ksched/build/
          cp lib/caladan/ksched/Kbuild lib/caladan/ksched/build/
          # Set proper permissions
          chmod -R 755 lib/caladan/ksched

      - name: Run install.sh
        env:
          KDIR: /lib/modules/$(uname -r)/build
          KERNEL_SRC: /usr/src/linux-headers-$(uname -r)
        run: scripts/install.sh

      - name: Install rust
        run: curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain=nightly

      - name: Compile Junction
        run: scripts/build.sh
