name: Build and Test Junction

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get kernel version
        id: kernel-version
        run: echo "KERNEL_VERSION=$(uname -r)" >> $GITHUB_ENV

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: linux-headers-${{ env.KERNEL_VERSION }} build-essential flex bison libelf-dev libssl-dev libboost-dev libboost-program-options-dev libfmt-dev libcap-dev
          version: 1.0

      - name: Cache CMake builds
        uses: actions/cache@v4
        with:
          path: |
            build/
            lib/caladan/build/
            lib/cereal/build/
            lib/flatbuffers/build/
          key: ${{ runner.os }}-cmake-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cmake-

      - name: Install kernel headers and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-headers-$(uname -r) build-essential
          sudo apt-get install -y flex bison libelf-dev libssl-dev

      - name: Run install.sh
        run: scripts/install.sh

      - name: Install rust
        run: curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain=nightly

      - name: Compile Junction
        run: scripts/build.sh
