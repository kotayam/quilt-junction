name: Build and Test Junction

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  build_junction:
    runs-on: ubuntu-latest
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@a54c7afa936fefeb4456b2dd8068152669aa8203
        with:
          toolchain: 1.82

      - name: Checkout submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Extract glibc submodule commit
        run: /bin/bash -c "echo -n glibc_commit=; (git ls-tree HEAD lib/glibc | awk '{print \$3}')" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Retrieve cached install dir
        with:
          path: |
            install
            lib/.glibc_installed_ver
          key: ${{ runner.os }}-build-${{ env.glibc_commit }}-install-${{ hashFiles('lib/patches/glibc/*', 'scripts/*') }}

      - name: Install dependencies
        run: |
          cd scripts
          ./install_cereal.sh
          ./install_cmake.sh
          ./install_glibc.sh
          ./install_flatbuffers.sh
          ./install_function_bench.sh

      - name: Build Junction
        run: |
          ./scripts/build.sh --ci
